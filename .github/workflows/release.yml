name: Release Widget (OpenWigiDash)

# Branch net10: versões 2.x para o OpenWigiDashManager. A main (1.x, net472) tem o próprio workflow.
on:
  push:
    tags:
      - 'v2*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      WIDGET_NAME: "StreamDeckMirrorWidget"
      CONFIGURATION: "Release"

    steps:
    - name: Checkout widget
      uses: actions/checkout@v4
      with:
        path: WigiDash-StreamDeckMirror-WidGet

    # O OpenWigi.Sdk ainda não está no NuGet: vem do repo do manager, clonado ao lado.
    # Repo privado: precisa do secret OPENWIGI_REPO_TOKEN (PAT com leitura em OpenWigiDashManager).
    - name: Checkout OpenWigiDashManager (SDK)
      uses: actions/checkout@v4
      with:
        repository: victorperez2911/OpenWigiDashManager
        token: ${{ secrets.OPENWIGI_REPO_TOKEN }}
        path: OpenWigiDashManager

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish
      run: dotnet publish WigiDash-StreamDeckMirror-WidGet/StreamDeckMirrorWidget.csproj -c ${{ env.CONFIGURATION }} -o dist/${{ env.WIDGET_NAME }}

    - name: Zip
      shell: pwsh
      run: |
        $zipName = "OpenWigiDash-StreamDeckMirrorWidget-${{ github.ref_name }}.zip"
        Get-ChildItem "dist\${{ env.WIDGET_NAME }}" | ForEach-Object { Write-Host "  - $($_.Name)" }
        Compress-Archive -Path "dist\${{ env.WIDGET_NAME }}" -DestinationPath $zipName
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ZIP_NAME }}
        generate_release_notes: true
