name: Release Widget

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      WIDGET_GUID: "B7E4D1A2-5C8F-4E9B-A3D6-1F2E3B4C5D6E"
      PROJECT_PATH: "StreamDeckMirrorWidget.csproj"
      CONFIGURATION: "Release"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x' # Use latest SDK to build .NET Framework projects

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build
      run: dotnet build ${{ env.PROJECT_PATH }} -c ${{ env.CONFIGURATION }}

    - name: Prepare Artifact
      shell: pwsh
      run: |
        $releaseDir = "dist\${{ env.WIDGET_GUID }}"
        $buildDir = "bin\${{ env.CONFIGURATION }}\net472"

        New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

        # Copy main widget files
        Copy-Item "$buildDir\*.dll" $releaseDir -Force
        Copy-Item "$buildDir\icon.png" $releaseDir -Force -ErrorAction SilentlyContinue

        # If icon is not in build dir, try project root
        if (-not (Test-Path "$releaseDir\icon.png")) {
            Copy-Item "icon.png" $releaseDir -Force -ErrorAction SilentlyContinue
        }

        # List what was included
        Write-Host "Contents of release directory:"
        Get-ChildItem $releaseDir | ForEach-Object { Write-Host "  - $($_.Name)" }

    - name: Zip Artifact
      shell: pwsh
      run: |
        $zipName = "WigiDash-StreamDeckMirrorWidget-${{ github.ref_name }}.zip"
        Compress-Archive -Path "dist\${{ env.WIDGET_GUID }}" -DestinationPath $zipName
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ env.ZIP_NAME }}
        generate_release_notes: true
